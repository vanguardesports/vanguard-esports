
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>404 — Vanguard Esports</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .error-code {
      font-size: clamp(100px, 25vw, 220px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -10px;
    }

    .error-page h1 {
      font-size: clamp(25px, 5vw, 42px);
      margin: 30px 0 15px;
    }

    .error-page p {
      color: #777;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .error-link {
      display: inline-block;
      padding: 16px 25px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }

    .error-link:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">VT</span>
        <span class="logo-text">VANGUARD<small>ESPORTS</small></span>
      </a>
    </div>
  </header>

  <main class="error-page">
    <div>
      <div class="section-label">PAGE NOT FOUND</div>
      <div class="error-code">404</div>
      <h1>Страница не найдена</h1>
      <p>
        Возможно, адрес был введён неправильно<br>
        или страница больше не существует.
      </p>
      <a href="index.html" class="error-link">НА ГЛАВНУЮ ↗</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© 2026 Vanguard Esports. Все права защищены.</span>
      <span>MORE THAN A TEAM.</span>
    </div>
  </footer>

</body>
</html>
